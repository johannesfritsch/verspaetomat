<!doctype html><html><head><style>html,body{margin:0;background:#000;overflow:hidden}svg{display:block}</style></head><body><svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1B2A4A"/><stop offset="1" stop-color="#3A4E78"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4B5876"/><stop offset="1" stop-color="#2C3550"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FFD98A" stop-opacity="0.75"/><stop offset="1" stop-color="#FFD98A" stop-opacity="0"/></radialGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE7AE"/><stop offset="1" stop-color="#F6C46A"/></linearGradient>
  </defs><g id="zoom">
  <rect width="900" height="1200" fill="url(#sky)"/>
  <g id="stars" fill="#FFFFFF" opacity="0.7"><circle cx="90" cy="90" r="2.5"/><circle cx="220" cy="150" r="2"/><circle cx="400" cy="70" r="2.5"/><circle cx="610" cy="120" r="2"/><circle cx="800" cy="60" r="3"/><circle cx="720" cy="200" r="2"/><circle cx="160" cy="250" r="2"/></g>
  <circle cx="760" cy="150" r="46" fill="#F4EBD0"/><circle cx="782" cy="136" r="44" fill="#1E2E50"/>
  <!-- roof -->
  <path d="M-20 330 L450 230 L920 330 L920 360 L-20 360 Z" fill="#2A3656"/>
  <rect x="-20" y="356" width="940" height="16" fill="#D61316"/>
  <g fill="#2A3656"><rect x="120" y="372" width="18" height="520"/><rect x="760" y="372" width="18" height="520"/></g>
  <!-- clock -->
  <g transform="translate(450 470)">
    <rect x="-4" y="-100" width="8" height="40" fill="#2A3656"/>
    <circle r="64" fill="#F7F7F8" stroke="#2A3656" stroke-width="10"/>
    <g stroke="#1B2A4A" stroke-width="5" stroke-linecap="round"><line x1="0" y1="-48" x2="0" y2="-40"/><line x1="48" y1="0" x2="40" y2="0"/><line x1="0" y1="48" x2="0" y2="40"/><line x1="-48" y1="0" x2="-40" y2="0"/></g>
    <line x1="0" y1="0" x2="0" y2="-38" stroke="#1B2A4A" stroke-width="7" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="26" y2="10" stroke="#1B2A4A" stroke-width="7" stroke-linecap="round" transform="rotate(-20)"/>
    <line id="second" x1="0" y1="8" x2="0" y2="-46" stroke="#D61316" stroke-width="3" transform="rotate(150)"/>
    <circle r="5" fill="#D61316"/>
  </g>
  <!-- mission building -->
  <rect x="190" y="590" width="520" height="320" rx="6" fill="#5A6B92"/>
  <rect x="190" y="590" width="520" height="56" fill="#46577D"/>
  <rect x="300" y="604" width="300" height="30" rx="6" fill="#2E8BC0"/>
  <g fill="#FFFFFF"><rect x="318" y="616" width="264" height="6" rx="3" opacity="0.9"/></g>
  <ellipse id="glow" cx="450" cy="790" rx="340" ry="230" fill="url(#glow)"/>
  <rect x="230" y="680" width="240" height="170" rx="8" fill="url(#win)"/>
  <rect x="230" y="760" width="240" height="8" fill="#E9AE52"/>
  <rect x="345" y="680" width="8" height="170" fill="#E9AE52"/>
  <rect x="520" y="680" width="150" height="230" rx="6" fill="#F6C46A"/>
  <circle cx="645" cy="800" r="7" fill="#9C6B2A"/>
  <!-- person silhouette in window -->
  <circle cx="290" cy="728" r="20" fill="#C98F4A"/><path d="M258 760 C262 738 318 738 322 760 Z" fill="#C98F4A"/>
  <!-- counter with tea -->
  <rect x="210" y="850" width="280" height="22" rx="4" fill="#3E4C70"/>
  <g transform="translate(410 812)">
    <path d="M-26 0 L26 0 L22 38 L-22 38 Z" fill="#F7F7F8"/>
    <path d="M26 8 C44 8 44 28 24 28" stroke="#F7F7F8" stroke-width="7" fill="none"/>
    <rect x="-26" y="10" width="52" height="8" fill="#D61316"/>
    <g id="steam" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.8"><path d="M-10 -8 C-20 -24 0 -30 -10 -48"/><path d="M8 -8 C-2 -24 18 -30 8 -48"/></g>
  </g>
  <!-- platform -->
  <rect x="0" y="910" width="900" height="290" fill="url(#floor)"/>
  <rect x="0" y="910" width="900" height="10" fill="#F6C46A" opacity="0.6"/>
  <g fill="#F7F7F8" opacity="0.18"><rect x="0" y="1040" width="900" height="6"/></g>
  <!-- bench -->
  <g transform="translate(140 1010)" fill="#7A3B2E"><rect x="0" y="0" width="200" height="16" rx="4"/><rect x="0" y="-40" width="200" height="14" rx="4"/><rect x="20" y="16" width="12" height="44"/><rect x="168" y="16" width="12" height="44"/></g>
  <!-- blanket on bench -->
  <path d="M190 1010 C200 975 270 975 290 1010 Z" fill="#D61316"/>
  <!-- suitcase -->
  <g transform="translate(640 1000)"><rect x="0" y="0" width="110" height="90" rx="10" fill="#2E8BC0"/><rect x="38" y="-18" width="34" height="22" rx="6" fill="none" stroke="#1F6A93" stroke-width="7"/><rect x="0" y="40" width="110" height="8" fill="#1F6A93"/><circle cx="18" cy="96" r="7" fill="#1B2A4A"/><circle cx="92" cy="96" r="7" fill="#1B2A4A"/></g>
  <!-- platform sign -->
  <g transform="translate(780 640)"><rect x="-34" y="-30" width="68" height="60" rx="8" fill="#F7F7F8"/><rect x="-24" y="-18" width="20" height="36" rx="3" fill="#1B2A4A"/><rect x="6" y="-18" width="8" height="36" rx="3" fill="#1B2A4A"/></g>
</g></svg>

<script>
const $=id=>document.getElementById(id);
const TAU=Math.PI*2;
function zoom(t){const z=1+0.07*t; const cx=450, cy=600; $("zoom").setAttribute("transform",`translate(${cx} ${cy}) scale(${z}) translate(${-cx} ${-cy})`);}
function scene(t,dur){
 const sec=t*dur;
 // the Bahnhofsuhr: 6 degrees a second, and it rests a moment at each full... we let it sweep
 $("second").setAttribute("transform",`rotate(${150+6*sec})`);
 $("stars").setAttribute("opacity",0.7+0.25*Math.sin(TAU*sec/2.5));
 const k=(sec%2.4)/2.4; $("steam").setAttribute("transform",`translate(${3*Math.sin(TAU*sec/1.7)} ${-14*k})`);
 $("steam").setAttribute("opacity",(0.8*(1-k)+0.0).toFixed(3)); if(sec<0.001) $("steam").setAttribute("opacity","0.8");
 $("glow").setAttribute("rx",340+12*Math.sin(TAU*sec/5)); $("glow").setAttribute("ry",230+8*Math.sin(TAU*sec/5));
}
window.setFrame=function(t,dur){zoom(t); scene(t,dur);};
setFrame(0,20);
</script></body></html>
