<script>
const $=id=>document.getElementById(id);
const TAU=Math.PI*2;
function zoom(t){const z=1+0.07*t; const cx=450, cy=600; $("zoom").setAttribute("transform",`translate(${cx} ${cy}) scale(${z}) translate(${-cx} ${-cy})`);}
function scene(t,dur){
 const sec=t*dur;
 $("clouds").setAttribute("transform",`translate(${40*t} 0)`);
 $("sunglow").setAttribute("r",90+6*Math.sin(TAU*sec/4));
 document.querySelectorAll(".seed").forEach((g,k)=>{const a=3.5*Math.sin(TAU*sec/3+k*0.9)*Math.min(1,sec/1.0); g.setAttribute("transform",g.dataset.base+` rotate(${a})`);});
 const tilt = sec<6?0:-25*Math.max(0,Math.sin(Math.PI*Math.min(1,(sec-6)/5)));
 $("can").setAttribute("transform",`translate(790 1080) rotate(${tilt})`);
}
window.setFrame=function(t,dur){zoom(t); scene(t,dur);};
setFrame(0,20);
</script></body></html>
