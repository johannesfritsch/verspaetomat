[[tariffs.flixtrain.sources]]
field = "payout_min"
doc = "flixtrain.de/fahrgastrechte"
quote = "Entschädigungen werden nur ausgezahlt, wenn der berechnete Betrag höher als 4 EUR ist."
grade = "verified"

[[tariffs.flixtrain.sources]]
field = "deadline"
doc = "flixtrain.de/fahrgastrechte"
quote = "innerhalb von drei Monaten nach der tatsächlichen oder geplanten Durchführung eines Linienverkehrsdienstes"
grade = "verified"

# ── Products ──────────────────────────────────────────────────────────────────────────────────────
#
# `family` groups products for the app's first question ("Welche Fahrkarte?"); within the family
# `zeitkarte` the product is the Verbund. `rule_line` is the one German sentence the app shows
# under a ticket; it must be true of every version below it.

[products.deutschlandticket]
tariff = "deutschlandtarif"
family = "deutschlandticket"
name = "Deutschlandticket"
rule_line = "Ab 20 Minuten zählt jede Verspätung mit. Je volle Stunde 1,50 €, gesammelt über Monate."
valid_on = { regional = true, long_distance = false, extra_routes = ["ic-bremen-norddeich", "ic-bremen-emden", "ic-stuttgart-singen", "ic-rostock-stralsund", "ice-rostock-hamburg", "ic-erfurt-gera", "ic-dresden-chemnitz", "ic-dortmund-dillenburg"] }
compensation = { kind = "minute_pool", counts_from = 20, unit = 60, per_unit = { second = 150, first = 225 } }
# Johannes, 30.09.2026: minutes pool across months, without limit (docs/49 §9). The cap stays per
# calendar month of the ride.
window = "subscription"
caps = [{ share = 2500, per = "calendar_month" }]
payout_min = { cents = 400, inclusive = false }
submit = "when_payable"
reduced_fare = true
release_after_min = 0
form = { season_box = true, number = "abo", price_proof = true, copy = true, birth_date = false }
prices = [
    { valid_from = 2025-01-01, cents = 5800 },
    { valid_from = 2026-01-01, cents = 6300 },
]

[[products.deutschlandticket.sources]]
field = "compensation"
doc = "Deutschlandtarif Teil C 8.1, Stand 14.12.2025 (angewendet über Tarifbestimmungen Deutschland-Ticket 1.6)"
quote = "Inhaber einer Fahrkarte oder Fahrtberechtigung als Zeitkarte können auch wiederholte Verspätungsfälle ab 20 Minuten innerhalb der Geltungsdauer der Zeitkarte zusammenrechnen … für jeweils volle 60 Minuten Verspätung eine Erstattung bzw. Entschädigung in Höhe von 1,50 € für die 2. Wagenklasse und 2,25 € für die 1. Wagenklasse"
grade = "verified"

[[products.deutschlandticket.sources]]
field = "window"
doc = "Tarifbestimmungen Deutschland-Ticket 1.3; Entscheidung Johannes 30.09.2026"
quote = "Das Abonnement wird für unbestimmte Zeit abgeschlossen und kann monatlich gekündigt werden."
grade = "inferred"

[[products.deutschlandticket.sources]]
field = "caps"
doc = "Deutschlandtarif Teil C 8.1; bahn.de-FAQ Deutschland-Ticket"
quote = "Insgesamt werden max. 25 % des gezahlten Zeitkartenpreises ausgezahlt."
grade = "verified"

[[products.deutschlandticket.sources]]
field = "reduced_fare"
doc = "Tarifbestimmungen Deutschland-Ticket 1.6"
quote = "Das Entgelt für das Deutschlandticket gilt als erheblich ermäßigtes Beförderungsentgelt gemäß § 3 EVO. Das zusätzliche Recht bei Verspätung gemäß § 11 Absatz 1 Nummer 1 EVO wird ausgeschlossen."
grade = "verified"

[[products.deutschlandticket.sources]]
field = "prices"
doc = "Tarifbestimmungen Deutschland-Ticket 1.4, Stand 15.06.2026"
quote = "… ab dem 01. Januar 2026 63,00 EUR pro Monat bei monatlicher Zahlung."
grade = "verified"

[products.bahncard100]
tariff = "db"
family = "bahncard100"
name = "BahnCard 100"
rule_line = "Ab 60 Minuten 10 € je Fahrt, in der 1. Klasse 15 €."
