doc = "BB Personenverkehr C.3.10.1, Stand 24.09.2026"
quote = "… ab 60 Minuten eine Erstattung bzw. Entschädigung in Höhe von 10 €, Inhaber einer BahnCard 100 1. Klasse eine solche in Höhe von 15 € erhalten, insgesamt max. 25 % des gezahlten BahnCard-Preises. Verspätungen können nicht zwecks Erreichen der Zeitgrenze nach Satz 1 addiert werden."
