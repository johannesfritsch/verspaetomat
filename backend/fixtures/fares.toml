[products.zeitkarte_spnv]
tariff = "spnv_standard"
family = "zeitkarte"
name = "Monats- oder Jahreskarte (anderer Verbund)"
rule_line = "Ab 60 Minuten 1,50 € je Fahrt, in der 1. Klasse 2,25 €."
