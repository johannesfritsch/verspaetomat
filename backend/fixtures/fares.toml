name = "Niedersachsentarif"

[tariffs.sh]
extends = "spnv_standard"
name = "SH-Tarif"
payout_min = { cents = 400, inclusive = false }

[[tariffs.sh.sources]]
field = "payout_min"
doc = "SH-Tarif, Tarifbestimmungen 01.01.2026, Anlage 5, 5.1.6"
quote = "Eine Zahlung erfolgt jeweils auf Antrag, wenn der Anspruch den Betrag von 4,00 € überschreitet (Bagatellgrenze)."
grade = "verified"

[tariffs.flixtrain]
extends = "eu_minimum"
name = "FlixTrain"
payout_min = { cents = 400, inclusive = false }
deadline = { from = "ride", months = 3, aim_months = 3 }
