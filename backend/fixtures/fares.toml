# The fare catalogue (docs/49 §5.2, issue #66): what each ticket is owed when a train is late.
#
# Three layers, each only saying what differs from the one above it:
#   tariffs   — whose conditions apply (DB, Deutschlandtarif, a Verbund, FlixTrain). A tariff may
#               `extends` another; `eu_minimum` is the root and must set every field.
#   products  — a kind of ticket in a tariff (Deutschlandticket, BahnCard 100, a Monatskarte VRS).
#   versions  — a product's rule from a date on (`valid_from`). A ride is computed with the version
#               of its date; a price or a rounding change is a new version, never an edit.
#
# The code knows the kinds of rule (src/fares/); this file holds the values. Every value that is
# not self-evident carries a source with its grade: verified (primary text), secondary (FAQ,
# Verbraucherzentrale, press), inferred, unknown. The full research is docs/49-recherche/.
#
# Money is in cents, shares in basis points (2500 = 25 %), minutes are minutes of delay at the
# destination of the ticket.

# ── Tariffs ───────────────────────────────────────────────────────────────────────────────────────

[tariffs.eu_minimum]
name = "VO (EU) 2021/782"
valid_on = { regional = true, long_distance = true }
compensation = { kind = "share_of_price", steps = [[60, 2500], [120, 5000]] }
window = "ticket"
min_cases = 0
caps = []
payout_min = { cents = 400, inclusive = true }
rounding = "cent"
submit = "immediately"
# Our rule, not the law's: the law gives one year after the ticket's validity ends (CIV Art. 60,
# BB A.9.5, DT-A 8.2.8); twelve months after the ride is never later than that and needs no
# answer to when an open-ended Abo "ends". Aim for three (docs/49 §1).
deadline = { from = "ride", months = 12, aim_months = 3 }
payout = "money"
claimant = "passenger"
desk = "operator"
reduced_fare = false
release_after_min = 0
form = { season_box = false, number = "booking", price_proof = false, copy = true, birth_date = false }
offer = "offered"
caveat = ""

[[tariffs.eu_minimum.sources]]
field = "compensation"
doc = "VO (EU) 2021/782 Art. 19 Abs. 1"
quote = "a) 25 % des Preises der Fahrkarte bei einer Verspätung von 60 bis 119 Minuten; b) 50 % des Preises der Fahrkarte ab einer Verspätung von 120 Minuten."
grade = "verified"

[[tariffs.eu_minimum.sources]]
field = "payout_min"
doc = "VO (EU) 2021/782 Art. 19 Abs. 8"
quote = "Dieser Mindestbetrag darf höchstens 4 EUR pro Fahrkarte betragen."
grade = "verified"

[[tariffs.eu_minimum.sources]]
field = "deadline"
doc = "BB Personenverkehr A.9.5; EBA-FAQ Fristen"
quote = "Ansprüche nach den Nummern 9.1 bis 9.3 verjähren innerhalb eines Jahres nach Ablauf der Geltungsdauer der Fahrkarte."
grade = "verified"

[tariffs.db]
extends = "eu_minimum"
name = "Beförderungsbedingungen der DB (BB Personenverkehr)"
release_after_min = 20

[[tariffs.db.sources]]
field = "rounding"
doc = "BB Personenverkehr 9.2.1, Stand 24.09.2026"
quote = "Der Betrag wird kaufmännisch auf die zweite Nachkommastelle gerundet."
grade = "verified"

[[tariffs.db.sources]]
field = "release_after_min"
doc = "BB Personenverkehr 9.1.1"
quote = "Muss vernünftigerweise davon ausgegangen werden, dass der Reisende … am Zielbahnhof … mindestens 20 Minuten verspätet ankommen wird, hat er, auch mit einer zuggebundenen Fahrkarte, … die Wahl zwischen (i) der Fortsetzung der Fahrt oder der Weiterreise mit geänderter Streckenführung …"
grade = "verified"

[tariffs.deutschlandtarif]
extends = "eu_minimum"
name = "Deutschlandtarif"
rounding = "up_to_5_cents"
release_after_min = 20

[[tariffs.deutschlandtarif.sources]]
field = "rounding"
doc = "Deutschlandtarif Teil A 8.2.6, Stand 14.06.2026"
quote = "Der Betrag wird auf einen durch 5 Cent teilbaren Betrag aufgerundet."
grade = "verified"

# The common text most Verbünde copy or defer to ("Fahrgastrechte im SPNV", current copy MDV
# Anlage 4 ab 01.08.2026). A Verbund with no deviation is this tariff.
[tariffs.spnv_standard]
extends = "eu_minimum"
name = "Fahrgastrechte im SPNV (gemeinsamer Text der Verbünde)"
rounding = "up_to_5_cents"
release_after_min = 20

[[tariffs.spnv_standard.sources]]
field = "compensation"
doc = "MDV Anlage 4 (Fahrgastrechte im SPNV), gültig ab 01.08.2026"
quote = "1) 1,50 Euro je Fall bei Zeitfahrkarten für die 2. Wagenklasse 2) 2,25 Euro je Fall bei Zeitfahrkarten (einschließlich Zusatzfahrkarten) für die 1. Wagenklasse"
grade = "verified"

[tariffs.vrr_nrw]
extends = "spnv_standard"
name = "Verbund- und Gemeinschaftstarife in NRW (VRR, VRS, AVV, WestfalenTarif, NRW-Tarif)"

[tariffs.hvv]
extends = "spnv_standard"
name = "hvv"

[tariffs.mvv]
extends = "spnv_standard"
name = "MVV"
deadline = { from = "validity_end", months = 3, aim_months = 3 }

[[tariffs.mvv.sources]]
field = "deadline"
doc = "MVV-Gemeinschaftstarif ab 01.01.2026, § 17 Abs. 6"
quote = "Der Anspruch muss innerhalb von 3 Monaten nach Ablauf der Geltungsdauer der Fahrkarte bzw. innerhalb eines Jahres nach der ersten zu entschädigenden Verspätung geltend gemacht werden."
grade = "verified"

[tariffs.vbb]
extends = "spnv_standard"
name = "VBB"

[tariffs.rmv]
extends = "spnv_standard"
name = "RMV"

[tariffs.niedersachsen]
