openapi: 3.1.0
info:
  title: Verspätomat API
  version: 0.2.0
  description: >
    Contract for the Flutter app. Amounts are euro cents; timestamps RFC 3339 UTC; dates YYYY-MM-DD.
    Station ids and trip ids are Transitous ids passed through unchanged (trip ids go in query parameters).
    Identity: one anonymous device per installation. Every route except /health, /v1/devices*,
    /v1/operators, /v1/ngos and /internal/* requires `Authorization: Bearer <token>`.
servers:
  - url: http://127.0.0.1:8080
paths:
  /health:
    get: { summary: Liveness and database check, responses: { "200": { description: "{ok, db}" } } }

  /v1/devices:
    post: { summary: Create a device; returns {device_id, token}. Store the token in the Keychain., responses: { "200": { description: device } } }
  /v1/devices/recover:
    post:
      summary: Re-attach a new phone with the recovery code; returns a fresh {device_id, token}.
      requestBody: { content: { application/json: { schema: { type: object, required: [recovery_code], properties: { recovery_code: { type: string } } } } } }
      responses: { "200": { description: device }, "404": { description: unknown code } }

  /v1/stations/nearby:
    get:
      summary: "Rail stations near a point: the phone's fix, or a Stellwerk override for this customer, never a default. Answers {stations, source: gps|stellwerk|none, label}."
      parameters: [{ name: lat, in: query, schema: { type: number } }, { name: lon, in: query, schema: { type: number } }]
      responses: { "200": { description: "[{id, name, lat, lon, distance_m}]" } }
  /v1/stations/search:
    get:
      parameters: [{ name: q, in: query, required: true, schema: { type: string } }]
      responses: { "200": { description: "[Station]" } }
  /v1/stations/{id}/departures:
    get:
      summary: Rail departures with live delays, platform, agency, our operator and claims desk, trip id.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: "[{trip_id, line, train_number, headsign, agency_name, operator, desk, category, planned_departure, live_departure, delay_min, platform, cancelled, realtime}]" } }
  /v1/trips:
    get:
      summary: One trip with stop-by-stop scheduled and live times.
      parameters: [{ name: trip_id, in: query, required: true, schema: { type: string } }]
      responses: { "200": { description: "{trip_id, line, headsign, agency_name, operator, category, cancelled, stops:[{stop_id, name, scheduled_arrival, live_arrival, scheduled_departure, live_departure, cancelled}]}" }, "404": { description: not found } }
  /v1/operators:
    get: { summary: Operator directory (name, aliases, desk, postal_address, email, accepts_email, last_verified), responses: { "200": { description: "[Operator]" } } }
  /v1/ngos:
    get: { summary: Partner NGOs with confirmed_total_cents and submitted_total_cents, responses: { "200": { description: "[Ngo]" } } }
  /v1/badges:
    get: { summary: Badge catalogue with earned_on for this customer, responses: { "200": { description: "[Badge]" } } }

  /v1/me:
    get: { summary: "Profile: nickname, relay_address, personal_data?, settings, points_total, points_this_week, level_name, next_level_name, next_level_at, home_station", responses: { "200": { description: Customer } } }
    patch:
      summary: Change settings (nickname, ticket, ngo_id, location_mode, notifications, show_on_boards, keep_correspondence, traewelling_linked, onboarding_done, home_station_id/name).
      responses: { "200": { description: Customer } }
    delete: { summary: Delete the device and everything it owns, responses: { "200": { description: "{deleted}" } } }
  /v1/me/personal-data:
    put:
      summary: Name, address, private e-mail, ticket number, first_class. Assigns the relay address on first call.
      requestBody: { content: { application/json: { schema: { type: object, required: [name, address, email], properties: { name: { type: string }, address: { type: string }, email: { type: string }, ticket_number: { type: string }, first_class: { type: boolean } } } } } }
      responses: { "200": { description: Customer } }
  /v1/me/recovery-code:
    get: { summary: Issue a new recovery code (twelve words). Shown once; the previous code stops working., responses: { "200": { description: "{recovery_code}" } } }
  /v1/me/export:
    get: { summary: Everything about this customer as JSON, responses: { "200": { description: export } } }

  /v1/rides:
    get: { summary: Ride history (newest first), responses: { "200": { description: "[Ride]" } } }
    post:
      summary: Check in. The follower polls the trip from now on.
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/CheckIn" } } } }
      responses: { "200": { description: "{ride, stops}" }, "409": { description: already riding } }
  /v1/rides/current:
    get: { summary: "Ride in progress: {ride, stops, eta, claim_from_minute, last_polled_at}; or the last arrival within 2 h as {ride, just_arrived:true}", responses: { "200": { description: live ride }, "404": { description: none } } }
  /v1/rides/current/arrival:
    post:
      summary: Finalise now, with a delay or an actual time (no-data case, or the demo control). Creates the incident if 60+ and awards badges.
      requestBody: { content: { application/json: { schema: { type: object, properties: { delay_minutes: { type: integer }, actual_arrival: { type: string, format: date-time }, cancelled: { type: boolean }, self_entered: { type: boolean } } } } } }
      responses: { "200": { description: "{ride, incident?, bundle_ready, new_badge?}" } }
  /v1/rides/current/dismiss:
    post: { summary: Acknowledge the arrival summary, responses: { "200": { description: ok } } }
  /v1/rides/nachtrag:
    post:
      summary: Record a forgotten ride from a trip id (1 point, claimable if the feed shows 60+, never ranks).
      requestBody: { content: { application/json: { schema: { type: object, required: [trip_id, from_station_id, from_station_name, exit_station_id, exit_station_name], properties: { trip_id: { type: string }, from_station_id: { type: string }, from_station_name: { type: string }, exit_station_id: { type: string }, exit_station_name: { type: string } } } } } }
      responses: { "200": { description: "{ride, incident?}" } }

  /v1/incidents:
    get: { summary: "Ledger: {incidents, claims, summary:{desks:[{desk, open_cents, ready, missing_cents, incident_ids}], ready_desk, confirmed_cents, submitted_cents, oldest_open:{id,line,date,deadline,days_left,warn_from}, min_payout_cents, dticket_monthly_cap_cents}}", responses: { "200": { description: ledger } } }
  /v1/claims:
    get: { responses: { "200": { description: "[Claim]" } } }
  /v1/claims/draft:
    post:
      summary: Start a claim for one desk (all open incidents there unless incident_ids given). Refused below the 4 € minimum.
      requestBody: { content: { application/json: { schema: { type: object, required: [desk], properties: { desk: { type: string }, incident_ids: { type: array, items: { type: string, format: uuid } } } } } } }
      responses: { "200": { description: "claim + incidents + desk_address, desk_email, desk_accepts_email, personal_data_required, relay_address, needs_recovery_code" }, "412": { description: bundle not ready } }
  /v1/claims/{id}:
    patch:
      summary: "Change the NGO for this claim; set attachments [{upload_id, label}] (one ticket image per month covered)."
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { "200": { description: claim } }
  /v1/uploads:
    post:
      summary: "multipart/form-data: kind (ticket|signature|postal_reply), file. Max 8 MB."
      responses: { "200": { description: "{upload_id, kind, content_type, size}" } }
  /v1/claims/{id}/sign:
    post:
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { content: { application/json: { schema: { type: object, required: [typed_name], properties: { typed_name: { type: string }, signature_upload_id: { type: string, format: uuid } } } } } }
      responses: { "200": { description: claim } }
  /v1/claims/{id}/send:
    post:
      summary: The relay. Refused unless signed and personal data present; max 5 per day. Real SMTP when SMTP_URL is set, else dry-run. BCC to the customer. Incidents become eingereicht.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { "200": { description: "{claim, mail}" }, "412": { description: not signed / no personal data / desk takes no e-mail }, "429": { description: daily limit } }

  /v1/mails:
    get: { summary: All mails in and out (newest first), responses: { "200": { description: "[Mail]" } } }
  /v1/mails/{id}/reply:
    post:
      summary: Answer a railway's question through the customer's relay address.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { content: { application/json: { schema: { type: object, required: [body], properties: { body: { type: string } } } } } }
      responses: { "200": { description: Mail } }
  /internal/inbound-mail:
    post:
      summary: Mail-provider webhook (and the demo's "Antwort simulieren"). Matches by relay address, classifies, forwards to the customer, updates statuses. Guarded by ?secret= when INBOUND_SECRET is set.
      requestBody: { content: { application/json: { schema: { type: object, required: [to, from, subject, body], properties: { to: { type: string }, from: { type: string }, subject: { type: string }, body: { type: string }, message_id: { type: string }, in_reply_to: { type: string }, claim_id: { type: string, format: uuid } } } } } }
      responses: { "200": { description: "{mail, outcome, claim_id}" } }

  /v1/community:
    get: { summary: "{minutes, submitted_cents, confirmed_cents, users, ngos:[{id, name, confirmed_cents, submitted_cents}]}", responses: { "200": { description: community } } }
  /v1/boards:
    get:
      parameters: [{ name: scope, in: query, schema: { type: string, enum: [line, city, germany] } }]
      responses: { "200": { description: "[{rank, name, points, is_me}]" } }

components:
  schemas:
    CheckIn:
      type: object
      required: [trip_id, from_station_id, from_station_name, exit_station_id, exit_station_name]
      properties:
        trip_id: { type: string }
        from_station_id: { type: string }
        from_station_name: { type: string }
        exit_station_id: { type: string }
        exit_station_name: { type: string }
        ticket: { type: string, enum: [deutschlandticket, zeitkarte, einzelfahrkarte] }
        location: { type: object, properties: { lat: { type: number }, lon: { type: number }, accuracy_m: { type: number } } }
