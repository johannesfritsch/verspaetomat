[package]
name = "verspaetomat-api"
version = "0.1.0"
edition = "2021"
description = "Verspätomat backend skeleton: serves the data the showcase app needs, in memory, from fixtures."
license = "AGPL-3.0-only"
default-run = "verspaetomat-api"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8.6", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid", "json", "migrate"] }
anyhow = "1.0.104"
sha2 = "0.11.0"
rand = "0.10.2"
hex = "0.4.3"
tower = { version = "0.5.3", features = ["util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "hostname", "pool", "ring", "webpki-roots"] }
url = "2.5.8"
clap = { version = "4.6.6", features = ["derive", "env"] }
futures-util = "0.3.34"
async-stream = "0.3.6"
typst-as-lib = { version = "0.16.0", features = ["typst-kit-embed-fonts", "typst-kit-fonts"] }
typst-pdf = "0.15.1"
mail-parser = "0.11.9"
typst = "0.15.1"
chrono-tz = "0.10"
typst-layout = "0.15.1"
