<!-- Die Bahnhofsuhr im Reiter. Die Farben sind die der App (app/lib/theme/tokens.dart):
     kühles Papier, blauschwarze Zeiger, und der Sekundenzeiger im hellen Rot, weil er das
     Zeichen ist und nicht die Handlung. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#F7F7F8"/>
  <circle cx="50" cy="50" r="42" fill="#FFFFFF" stroke="#0F1522" stroke-width="6"/>
  <line x1="50" y1="50" x2="50" y2="26" stroke="#0F1522" stroke-width="9" stroke-linecap="square"/>
  <line x1="50" y1="50" x2="70" y2="62" stroke="#0F1522" stroke-width="9" stroke-linecap="square"/>
  <line x1="50" y1="52" x2="50" y2="22" stroke="#FE171A" stroke-width="4"/>
  <circle cx="50" cy="24" r="8" fill="none" stroke="#FE171A" stroke-width="4"/>
</svg>
