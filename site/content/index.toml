[nicht]
eyebrow = "Was wir nicht sind"
title = "Fünf Dinge, die hier fehlen."

[[nicht.punkt]]
title = "Keine Provision."
text = "Andere behalten 20 bis 30 Prozent. Wir behalten nichts — wir bekommen nichts."

[[nicht.punkt]]
title = "Kein Konto."
text = "Keine E-Mail, kein Passwort. Ein anonymes Gerätekonto und zwölf Wörter, falls du das Handy wechselst."

[[nicht.punkt]]
title = "Kein Tracking."
text = "Keine Analyse-SDKs, keine Werbung, kein Datenverkauf. Diese Seite lädt nichts von Dritten."

[[nicht.punkt]]
title = "Kein Standortverlauf."
text = "Die App schaut einmal am Bahnsteig und einmal beim Einchecken. Den Zug verfolgt der Fahrplan, nicht dein Handy."

[[nicht.punkt]]
title = "Bote, kein Vertreter."
text = "Der Antrag ist deiner, er trägt deinen Namen und deine Unterschrift. Wir füllen aus und leiten weiter."
link = "/bote"
link_text = "Wie das geht"

[fragen]
eyebrow = "Fragen"
title = "Was Leute zuerst wissen wollen."

[[fragen.frage]]
q = "Was kostet das?"
a = "Nichts. Keine Gebühr, keine Provision, keine Werbung, keine In-App-Käufe."

[[fragen.frage]]
q = "Wer bekommt das Geld?"
a = "Der Verein, den du in der App wählst. Auf dem Antrag steht seine Kontoverbindung, nie unsere. Die Bahn überweist direkt."

[[fragen.frage]]
q = "Ab wann gibt es überhaupt Geld?"
a = "Ab 60 Minuten Verspätung am Ziel: 25 % des Fahrpreises. Ab 120 Minuten: 50 %. Darunter gibt es keinen gesetzlichen Anspruch — dafür Geduldspunkte."

[[fragen.frage]]
q = "Und mit dem Deutschlandticket?"
a = "Da sind es pauschal 1,50 € im Nahverkehr. Auszahlen muss die Bahn erst ab 4 €, deshalb sammelt Verspätomat, bis drei Verspätungen zusammenkommen, und schickt sie als einen Antrag."

[[fragen.frage]]
q = "Muss ich mich anmelden?"
a = "Nein. Beim ersten Antrag brauchst du Name und Adresse, weil das Formular sie verlangt. Vorher nichts."

[[fragen.frage]]
q = "Was macht die App mit meinem Standort?"
a = "Sie fragt den Bahnhof ab, an dem du stehst, und merkt sich beim Einchecken einen Fixpunkt als Nachweis. Kein Standort während der Fahrt, kein Verlauf. Ohne Standortfreigabe tippst du den Bahnhof ein und alles andere funktioniert."

[[fragen.frage]]
q = "Vertritt Verspätomat mich gegenüber der Bahn?"
a = "Nein, und das ist Absicht. Du stellst den Antrag, wir füllen ihn aus und leiten ihn weiter."

[[fragen.frage]]
q = "Welche Züge?"
a = "Alle, die in den offenen Fahrplandaten stehen: Fern- und Nahverkehr, jedes Eisenbahnunternehmen in Deutschland, und auch der Schienenersatzverkehr, wenn der Bus unter der Zugnummer fährt."

[[fragen.frage]]
q = "Was, wenn die Bahn ablehnt?"
a = "Die Antwort landet in der App, im Klartext. Wenn du sie für falsch hältst, ist die Schlichtungsstelle söp kostenlos zuständig — zwischen dir und der Bahn, ohne uns."

[holen]
eyebrow = "Holen"
title = "Noch nicht ganz da."

