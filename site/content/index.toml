[meta]
title = "Verspätomat"
description = "Verspätomat merkt sich deine Zugverspätungen, füllt den Fahrgastrechte-Antrag aus und schickt ihn ab. Die Entschädigung geht an einen Verein, den du wählst."

[hero]
eyebrow = "Fahrgastrechte, ohne Papierkrieg"
headline = "Die Bahn war zu spät. Diesmal zahlt sie dafür."
lead = "Verspätomat merkt sich deine Verspätungen, füllt den Antrag aus und schickt ihn ab. Das Geld geht an einen Verein, den du wählst. Nicht an uns."
cta = "Im App Store laden"
cta_secondary = "So funktioniert’s ↓"

# Ein Beispiel, und es steht auch so auf der Karte. Erfundene Zahlen als echte auszugeben
# ist das Einzige, was diese Seite nicht tun darf.
[hero.karte]
fahrgast = "Johannes"
strecke = "Köln Hbf → Rheine"
am = "Fr, 11. September 2026"
minuten = 204
ngo = "Bahnhofsmission Köln"
betrag = "12,00 €"
zitat = "„Ich habe die Bahn dazu gebracht, an die Bahnhofsmission Köln zu zahlen. Weil sie mich 204 Minuten warten ließ.“"
hinweis = "Beispiel. Deine Karte trägt deine Zahlen."

[fahrplan]
eyebrow = "Der Fahrplan"
title = "Einchecken, warten, kassieren lassen."

[[fahrplan.halt]]
label = "Einchecken"
text = "Am Bahnsteig ein Tipp. Dein Zug steht schon in der Liste, weil das Handy weiß, wo du stehst."

[[fahrplan.halt]]
label = "Fahren"
text = "Leg das Handy weg. Die Verspätung holt unser Server aus den öffentlichen Fahrplandaten — nicht aus deinem Standort."

[[fahrplan.halt]]
label = "Ankommen"
text = "Jede Minute wird gezählt. Unter 60 Minuten gibt es Geduldspunkte. Ab 60 Minuten einen Anspruch."

[[fahrplan.halt]]
label = "Antrag stellen"
text = "Das EU-Formular ist ausgefüllt. Du unterschreibst mit dem Finger, der Antrag geht von deiner eigenen Adresse an die Fahrgastrechte-Stelle."

[[fahrplan.halt]]
label = "Die Bahn zahlt"
text = "An den Verein, den du gewählt hast. Direkt auf sein Konto. Wir sehen das Geld nie."

