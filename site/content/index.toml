# Every word on the front page (docs/31 §2). Nothing here is rendered anywhere else.
# The three legal documents are not in this file: they come from the app, see content/legal.json.

[meta]
title = "Verspätomat"
description = "Verspätomat merkt sich deine Zugverspätungen, füllt den Fahrgastrechte-Antrag aus und schickt ihn ab. Die Entschädigung geht an einen Verein, den du wählst."

# Die Kopfzeile. Die Ziele sind Anker auf dieser Seite; ein Rechtstext bekommt sie nicht.
[kopf]
cta = "App holen"

[[kopf.zeile]]
label = "So funktioniert’s"
href = "#fahrplan"

[[kopf.zeile]]
label = "Die App"
href = "#bilder"

[[kopf.zeile]]
label = "Was fehlt"
href = "#nicht"

[[kopf.zeile]]
label = "Fragen"
href = "#fragen"

[hero]
eyebrow = "Verspätungen sammeln. Gutes tun."
# Zweigeteilt, weil die zweite Hälfte rot steht — das ist die einzige Stelle auf der Seite,
# an der Rot einen Satz trägt statt einen Knopf.
headline = "Die Bahn war zu spät."
headline_rot = "Jetzt zahlt sie dafür."
# „erstellt automatisch Erstattungsanträge" stand so im Entwurf. Die App erstellt nichts von
# selbst: sie füllt aus, du unterschreibst, sie leitet weiter (docs/05, Bote statt Vertreter).
lead = "Verspätomat merkt sich deine Verspätungen, füllt für dich den Antrag aus und schickt ihn ab. Das Geld geht an einen Verein, den du wählst. Kein Cent davon an uns."
cta_secondary = "So funktioniert’s ↓"

[[hero.haken]]
text = "Kostenlos"

[[hero.haken]]
text = "Kein Geldfluss über uns"

[[hero.haken]]
text = "Kein Tracking"

# Ein Beispiel, und es steht auch so auf der Karte. Erfundene Zahlen als echte auszugeben
# ist das Einzige, was diese Seite nicht tun darf.
[hero.karte]
fahrgast = "Johannes"
strecke = "Köln Hbf → Rheine"
am = "Fr, 11. September 2026"
minuten = 204
ngo = "Bahnhofsmission Köln"
betrag = "12,00 €"
zitat = "„Ich habe die Bahn dazu gebracht, an die Bahnhofsmission Köln zu zahlen. Weil sie mich 204 Minuten warten ließ.“"
hinweis = "Beispiel. Deine Karte trägt deine Zahlen."

[fahrplan]
eyebrow = "So funktioniert’s"
title = "Einchecken, warten, zahlen lassen."

# Die getönte Karte neben den Halten. „Statt Ärger einfach Gutes tun — für eine solidarische
# Gesellschaft" stand im Entwurf; das ist nicht der Ton dieses Produkts (docs/10). Was hier
# steht, ist nachprüfbar.
[fahrplan.karte]
title = "Deine Verspätung bewirkt etwas."
text = "Unter 60 Minuten gibt es Geduldspunkte. Ab 60 Minuten einen gesetzlichen Anspruch — und der geht an einen Verein, nicht an uns."

[[fahrplan.halt]]
label = "Einchecken"
icon = "zug"
text = "Am Bahnsteig ein Tipp. Dein Zug steht schon in der Liste, weil das Handy weiß, wo du stehst."

[[fahrplan.halt]]
label = "Fahren"
icon = "uhr"
text = "Leg das Handy weg. Die Verspätung holt unser Server aus den öffentlichen Fahrplandaten — nicht aus deinem Standort."

[[fahrplan.halt]]
label = "Ankommen"
icon = "halt"
text = "Jede Minute wird gezählt. Unter 60 Minuten gibt es Geduldspunkte. Ab 60 Minuten einen Anspruch."

[[fahrplan.halt]]
label = "Antrag stellen"
icon = "blatt"
text = "Das EU-Formular ist ausgefüllt. Du unterschreibst mit dem Finger, der Antrag geht von deiner eigenen Adresse an die Fahrgastrechte-Stelle."

[[fahrplan.halt]]
label = "Die Bahn zahlt"
icon = "herz"
text = "An den Verein, den du gewählt hast. Direkt auf sein Konto. Wir sehen das Geld nie."

